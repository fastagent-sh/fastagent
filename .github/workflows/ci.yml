name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor (RUNTIME_FLOOR in src/runtime.ts, package.json engines) and the next LTS. The floor's own
        # line (`24`) is not a third entry: it only sits between these two, and a job that cannot fail
        # differently is one more chance for a flaky test to fail the run.
        node-version: ['24.15.0', '26']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint and typecheck do not depend on the Node version, so they run once, on the floor.
      - name: Lint
        if: matrix.node-version == '24.15.0'
        run: npm run lint

      - name: Typecheck
        if: matrix.node-version == '24.15.0'
        run: npm run typecheck

      # A failed run keeps its whole report: which tests failed and how, beyond what the log above holds.
      - name: Unit tests
        run: npm test -- --reporter=default --reporter=json --outputFile.json=test-reports/unit.json

      - name: Keep the unit report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-report-node-${{ matrix.node-version }}
          path: test-reports/
          retention-days: 14

  # One Node version: what these tests add over the unit tier is the operating system and the tools on it (processes,
  # signals, git, tsc), not the runtime.
  integration:
    name: Integration (Node 24.15.0)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration -- --reporter=default --reporter=json --outputFile.json=test-reports/integration.json

      - name: Keep the integration report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-report
          path: test-reports/
          retention-days: 14

  package-smoke:
    name: Packed package smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Pack, install, and import the published surface
        run: |
          tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          echo "TARBALL=$RUNNER_TEMP/$tarball" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/package-smoke"
          cd "$RUNNER_TEMP/package-smoke"
          npm init -y
          npm install "$RUNNER_TEMP/$tarball" --ignore-scripts
          node --input-type=module -e 'await import("@fastagent-sh/fastagent"); await import("@fastagent-sh/fastagent/client"); await import("@fastagent-sh/fastagent/telegram"); await import("@fastagent-sh/fastagent/slack"); await import("@fastagent-sh/fastagent/feishu"); await import("@fastagent-sh/fastagent/lark")'
          ./node_modules/.bin/fastagent --version

      # An agent made by `init` from the packed package answers through `invoke`, builds, and its build answers in an app.
      - name: End to end on the packed package
        run: node test/smoke/e2e/packed.ts "$TARBALL"

  bun-smoke:
    name: Bun 1.4 smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # The floor: the instance's storage is node:sqlite, which Bun ships from 1.4.0.
          bun-version: '1.4.0'

      - name: Install and build
        run: npm ci && npm run build

      - name: Smoke public imports and CLI
        run: |
          bun -e 'await import("./dist/index.js"); await import("./dist/client.js"); await import("./dist/telegram.js"); await import("./dist/slack.js"); await import("./dist/feishu.js"); await import("./dist/lark.js")'
          bun dist/cli.js models gpt-5.5
          bun dist/cli.js --version

      # Vitest runs on Node; this is the serving host's contract on Bun's own server.
      - name: Serve on Bun
        run: bun test/smoke/bun/serve.ts

      - name: Open a built package on Bun
        run: bun test/smoke/bun/built.ts

      - name: Slack Socket Mode on Bun
        run: bun test/smoke/bun/slack-socket.ts

      - name: The AgentCore container's secret read on Bun
        run: bun test/smoke/bun/runtime-secrets.ts

      - name: The AgentCore command shell on Bun
        run: bun test/smoke/bun/agentcore-shell.ts

  # Stable-named aggregate gate: this is the branch-protection required check.
  # Keeping a fixed name (independent of the matrix) means adding/removing Node
  # versions never requires editing branch protection. ("Core" = the essential
  # aggregate gate, not the removed core/ directory.)
  core-checks:
    name: Core checks
    needs: [unit, integration, package-smoke, bun-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to pass
        run: |
          [ "${{ needs.unit.result }}" = "success" ]
          [ "${{ needs.integration.result }}" = "success" ]
          [ "${{ needs.package-smoke.result }}" = "success" ]
          [ "${{ needs.bun-smoke.result }}" = "success" ]
