name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor (RUNTIME_FLOOR in packages/fastagent/src/runtime.ts, package.json engines) and the next LTS. The floor's own
        # line (`24`) is not a third entry: it only sits between these two, and a job that cannot fail
        # differently is one more chance for a flaky test to fail the run.
        node-version: ['24.15.0', '26']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint and typecheck do not depend on the Node version, so they run once, on the floor.
      - name: Lint
        if: matrix.node-version == '24.15.0'
        run: npm run lint

      - name: Typecheck
        if: matrix.node-version == '24.15.0'
        run: npm run typecheck

      # A failed run keeps its whole report: which tests failed and how, beyond what the log above holds.
      - name: Unit tests
        run: npm test -- --reporter=default --reporter=json --outputFile.json=test-reports/unit.json

      - name: Keep the unit report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-report-node-${{ matrix.node-version }}
          path: test-reports/
          retention-days: 14

  # One Node version: what these tests add over the unit tier is the operating system and the tools on it (processes,
  # signals, git, tsc), not the runtime.
  integration:
    name: Integration (Node 24.15.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # The server the PostgreSQL double is held against (double-parity/postgres-double.integration.test.ts).
      postgres:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_PASSWORD: fastagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        env:
          FASTAGENT_TEST_POSTGRES_URL: postgres://postgres:fastagent@127.0.0.1:5432/postgres
        run: npm run test:integration -- --reporter=default --reporter=json --outputFile.json=test-reports/integration.json

      - name: Keep the integration report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-report
          path: test-reports/
          retention-days: 14

  package-smoke:
    name: Packed package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Every package packed, installed together (a package's dependency on another is a version not yet published),
      # and imported by its entries.
      - name: Pack, install, and import the published surface
        run: |
          mkdir "$RUNNER_TEMP/tarballs" "$RUNNER_TEMP/package-smoke"
          npm pack --workspaces --silent --pack-destination "$RUNNER_TEMP/tarballs"
          cd "$RUNNER_TEMP/package-smoke"
          npm init -y
          npm install "$RUNNER_TEMP"/tarballs/*.tgz --ignore-scripts
          node --input-type=module -e 'await import("@fastagent-sh/client"); await import("@fastagent-sh/client/auth"); await import("@fastagent-sh/client-agentcore"); await import("@fastagent-sh/client-agentcore/auth"); await import("@fastagent-sh/fastagent"); await import("@fastagent-sh/fastagent/harness"); await import("@fastagent-sh/agentcore"); await import("@fastagent-sh/harness-dsh"); await import("@fastagent-sh/harness-dsh/provider")'
          ./node_modules/.bin/fastagent --version

      # An agent made by `init` from the packed packages answers through `invoke`, builds, and its build answers in an app.
      - name: End to end on the packed packages
        run: node test/smoke/e2e/packed.ts "$RUNNER_TEMP"/tarballs/*.tgz

      # Every production example builds, passes `deploy check`, and type-checks against the packed packages.
      - name: Verify production examples against packed packages
        run: node test/smoke/e2e/examples.ts "$RUNNER_TEMP"/tarballs/*.tgz

  bun-smoke:
    name: Bun 1.4.4 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # The floor: Bun 1.4.4 reliably releases EXCLUSIVE node:sqlite locks on DatabaseSync.close().
          bun-version: '1.4.4'

      - name: Install and build
        run: npm ci && npm run build

      - name: Run Bun runtime and CLI smoke checks
        run: bun --conditions=@fastagent-sh/source test/smoke/bun/runtime.ts

      - name: Pack, install with Bun, and verify published surface
        run: |
          mkdir "$RUNNER_TEMP/tarballs" "$RUNNER_TEMP/bun-package-smoke"
          npm pack --workspaces --silent --pack-destination "$RUNNER_TEMP/tarballs"
          cd "$RUNNER_TEMP/bun-package-smoke"
          bun -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const { execFileSync } = require("node:child_process");
            const dir = path.join(process.env.RUNNER_TEMP, "tarballs");
            const overrides = {};
            for (const file of fs.readdirSync(dir).filter((name) => name.endsWith(".tgz"))) {
              const tgz = path.join(dir, file);
              const pkg = JSON.parse(execFileSync("tar", ["-xOzf", tgz, "package/package.json"], { encoding: "utf8" }));
              overrides[pkg.name] = `file:${tgz}`;
            }
            fs.writeFileSync("package.json", JSON.stringify({ name: "bun-package-smoke", private: true, type: "module", overrides }, null, 2) + "\n");
          '
          bun add "$RUNNER_TEMP"/tarballs/*.tgz --ignore-scripts
          bun -e 'await import("@fastagent-sh/client"); await import("@fastagent-sh/client/auth"); await import("@fastagent-sh/client-agentcore"); await import("@fastagent-sh/client-agentcore/auth"); await import("@fastagent-sh/fastagent"); await import("@fastagent-sh/fastagent/harness"); await import("@fastagent-sh/agentcore"); await import("@fastagent-sh/harness-dsh"); await import("@fastagent-sh/harness-dsh/provider")'
          bun ./node_modules/.bin/fastagent --version

  # Stable-named aggregate gate: this is the branch-protection required check.
  # Keeping a fixed name (independent of the matrix) means adding/removing Node
  # versions never requires editing branch protection. ("Core" = the essential
  # aggregate gate, not the removed core/ directory.)
  core-checks:
    name: Core checks
    needs: [unit, integration, package-smoke, bun-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to pass
        run: |
          [ "${{ needs.unit.result }}" = "success" ]
          [ "${{ needs.integration.result }}" = "success" ]
          [ "${{ needs.package-smoke.result }}" = "success" ]
          [ "${{ needs.bun-smoke.result }}" = "success" ]
