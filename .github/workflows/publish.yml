name: Publish

# Publish every package of the workspace (packages/*) to npm from a GitHub Release via Trusted Publishing (OIDC), with
# provenance and no NPM_TOKEN. Publishing requires the public fastagent-sh/fastagent repository; each package's npm
# trusted publisher must name org fastagent-sh, repo fastagent, workflow publish.yml, environment npm. The protected environment is the manual gate; this job also verifies the tag and commit.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC token for Trusted Publishing

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    services:
      # The server the PostgreSQL double is held against (double-parity/postgres-double.integration.test.ts).
      postgres:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_PASSWORD: fastagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Verify public release repository
        env:
          REPOSITORY: ${{ github.repository }}
          VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          if [[ "$REPOSITORY" != "fastagent-sh/fastagent" || "$VISIBILITY" != "public" ]]; then
            echo "publishing requires public repository fastagent-sh/fastagent (got $REPOSITORY, $VISIBILITY)" >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release commit is on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "release tag must point to a commit on main" >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          scope: '@fastagent-sh'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches every package's version
        run: |
          for manifest in packages/*/package.json; do
            node -e 'const pkg = require("./" + process.argv[1]); if (process.env.GITHUB_REF_NAME !== "v" + pkg.version) { console.error(pkg.name + " is at " + pkg.version + ", not the release tag " + process.env.GITHUB_REF_NAME); process.exit(1) }' "$manifest"
          done

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Integration tests
        env:
          FASTAGENT_TEST_POSTGRES_URL: postgres://postgres:fastagent@127.0.0.1:5432/postgres
        run: npm run test:integration

      - name: Publish with provenance
        run: npm publish --workspaces --provenance --access public
