name: Live

# The probes that need the real world: a published tarball, a real model provider, a real container.
# Never a PR check — an external contributor has no credentials, and a platform's bad night must not
# read as a broken pull request. Nightly, plus on demand.
#
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact published version to probe (default: the registry's current latest). Applies to BOTH the registry install and the container image."
        required: false
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    name: Live probes
    runs-on: ubuntu-latest
    # vitest's own ceiling covers the tests; `npm ci` and a container build sit outside it. Nobody is
    # watching a nightly run, and the 6h default would hold the next one behind it (the group does not
    # cancel in progress).
    #
    # 120, not 60: the probes run SERIALLY (`fileParallelism: false`) and their own budgets already add
    # up past an hour — the AgentCore deploy alone declares 30 minutes for the stack plus 15 for its
    # teardown, on top of the fly and railway deploys and a container build. At 60 this job would hit
    # the ceiling on a normal-but-slow night, and it would hit it DURING the most expensive probe, in
    # the one place where the sweeps below are all that stand between a kill and a billing leak.
    timeout-minutes: 120
    environment: live # holds FASTAGENT_LIVE_MODEL and the provider key
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The tunnel probe needs the binary `dev --tunnel` shells out to. Deliberately the LATEST
      # release, not the version deploy/docker/plan.ts pins for generated Compose: that pin exists so a
      # deployment does not move under its operator, while this probe exists to find out when the tool
      # we shell out to changes. Pinning it here would retire the only check that would notice.
      #
      # Through Cloudflare's apt repo rather than a raw .deb from releases/latest: still that latest
      # build, but signed and verified by apt — this job stages an OAuth grant on the same runner.
      - name: Install cloudflared
        run: |
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
            | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' \
            | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update
          sudo apt-get install -y cloudflared
          cloudflared --version

      # The Fly probe shells out to `flyctl`, the same binary `deploy fly --run` drives. Pinned to a
      # commit like every other action here; it only installs the CLI, which then reads FLY_API_TOKEN
      # from the environment below.
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      # The driver spawns `fly`, the short name Fly's own installer also provides; this action ships
      # only `flyctl`. Without the alias `deploy fly --run` fails with "flyctl not found" on a runner
      # that demonstrably has it.
      - name: Provide the `fly` alias the driver spawns
        run: |
          sudo ln -sf "$(command -v flyctl)" /usr/local/bin/fly
          fly version

      # The railway probes shell out to `railway`, the same binary `deploy railway --run` drives.
      # Railway publishes no pinned action; the install script is their documented path.
      #
      # The VERSION comes from the npm registry, not from the script's own lookup. Unpinned, that
      # lookup is an unauthenticated api.github.com call the script itself calls out as "rate limited
      # to 60/hour per source IP, which shared CI runners exhaust" — and it exits 1 when the limit is
      # hit, turning a nightly red for someone else's traffic. `@railway/cli` is published from the
      # same release (its postinstall pulls releases/download/v<its own version>), so `latest` there
      # is the same build, resolved through a registry this job already depends on. Still LATEST, for
      # the cloudflared reason: this probe exists to find out when the CLI drifts, and a pin retires it.
      - name: Install the Railway CLI
        run: |
          # Without pipefail a failed `curl` feeds `sh` an empty script, which exits 0 — the step goes
          # green and the suite fails twenty minutes later with `spawn railway ENOENT`. The default
          # shell here is `bash -e {0}`; `-o pipefail` is NOT included.
          set -o pipefail
          RAILWAY_VERSION="$(npm view @railway/cli version)"
          test -n "$RAILWAY_VERSION" || { echo "could not resolve a Railway CLI version from npm"; exit 1; }
          curl -fsSL https://railway.com/install.sh | RAILWAY_VERSION="$RAILWAY_VERSION" sh
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"
          "$HOME/.railway/bin/railway" --version

      # The AgentCore image must be linux/arm64 (the runtime's only architecture), which the driver
      # cross-builds with `docker buildx`. Ubuntu runners ship docker, and this adds the plugin plus
      # the QEMU emulation an arm64 build needs on an x86 runner.
      - name: Set up QEMU and buildx for the arm64 image
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      # ONE credential mechanism for both probes: an auth.json, named by the product's own
      # FASTAGENT_AUTH_PATH. It carries an OAuth grant (openai-codex) as readily as an API key, and
      # `deploy docker --run` turns the same file into the container's FASTAGENT_AUTH_SEED.
      #
      # The secret holds a grant minted FOR CI and used nowhere else (`fastagent login openai-codex
      # --auth-path <ci file>`, device-code flow). That isolation is the point: pi persists a NEW
      # refresh token on every refresh, so any file sharing this grant goes stale the moment another
      # one refreshes it — a maintainer's laptop and this workflow must not be the same grant.
      #
      # The secret is still a SNAPSHOT: CI's own refreshes live and die with the runner, so the stored
      # token ages. Whether it eventually stops being accepted is the provider's call, not something
      # this file should claim. When a run fails to authenticate, re-run the login above and re-set the
      # secret; an API-key credential in the same variable avoids the question entirely.
      - name: Stage the model credential
        env:
          FASTAGENT_AUTH_JSON: ${{ secrets.FASTAGENT_AUTH_JSON }}
        run: |
          # An unset secret would write an EMPTY auth.json, and the probes would then report the
          # product's own "no model credential" gate — a CI misconfiguration wearing a product bug's
          # face. Same rule as test/live/env.ts: missing configuration fails here, loudly.
          test -n "$FASTAGENT_AUTH_JSON" || { echo "secrets.FASTAGENT_AUTH_JSON is not set for this environment"; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/secrets"
          umask 077 && printf '%s' "$FASTAGENT_AUTH_JSON" > "$RUNNER_TEMP/secrets/auth.json"

      # The ONE version both probes land on, resolved here so they cannot land on two. `latest`
      # rather than this checkout's version: between a `chore(release)` merge and the Release that
      # triggers publish.yml, this checkout names a version npm does not serve, and a nightly that is
      # red every release cycle for a non-defect trains people to ignore it. Resolved to an EXACT
      # version, never handed down as the tag: the registry probe asserts what `--version` reports,
      # and the container image would resolve the tag a second time.
      - name: Resolve the version under probe
        env:
          PINNED: ${{ inputs.version }}
        run: |
          VERSION="${PINNED:-$(npm view @fastagent-sh/fastagent version)}"
          test -n "$VERSION" || { echo "could not resolve a published version to probe"; exit 1; }
          echo "FASTAGENT_LIVE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run live probes
        env:
          FASTAGENT_LIVE_MODEL: ${{ vars.FASTAGENT_LIVE_MODEL }}
          FASTAGENT_AUTH_PATH: ${{ runner.temp }}/secrets/auth.json
          # A bot of the probe's OWN: it sets and then deletes that bot's webhook, which would take
          # down whatever traffic a shared bot was serving.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Likewise an app of the probe's own: registering rewrites its event Request URL.
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_VERIFICATION_TOKEN: ${{ secrets.FEISHU_VERIFICATION_TOKEN }}
          # OPTIONAL, unlike the three above, because the platform's Encrypt Key is: set it only if the
          # probe's app has one configured, and the channel then decrypts the url_verification
          # challenge instead of refusing it. An unset secret expands to "", which the channel file's
          # `|| undefined` reads as absent — the same reason env.ts prefers `||` over `??`.
          FEISHU_ENCRYPT_KEY: ${{ secrets.FEISHU_ENCRYPT_KEY }}
          # A LONG-LIVED xoxb- (token rotation off): a runner has no durable volume to catch a
          # refreshed pair, so a rotating credential would be revoked by its own first refresh.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_TEST_CHANNEL: ${{ secrets.SLACK_TEST_CHANNEL }}
          # WRITE scope. `vitest.live.config.ts` includes the whole test/live directory, so this ONE
          # token serves both fly probes: fly.live.test.ts only reads, but fly-deploy.live.test.ts
          # creates a real app + volume, stages secrets, runs a remote build and destroys it again.
          # A read-only token makes the nightly red at `apps create`; a write token bills every night.
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # ACCOUNT-scoped, NOT the project-scoped RAILWAY_TOKEN a project hands out: the deploy probe
          # creates a project, which a project token cannot do. The driver never reads it — it assumes
          # an operator who ran `railway login` and only names the variable in its gate message, so
          # here the token stands in for the session CI has no way to hold.
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          # Scoped by an inline IAM policy to the resources the deploy probe creates and destroys: a
          # CloudFormation stack, an ECR repository, an S3 bucket and an AgentCore runtime. The policy
          # needs FOUR patterns, not one — the driver derives each name differently from the same
          # `live-probe-<uuid8>` directory, and only the stack wears the `fastagent-` prefix:
          #   stack `fastagent-live-probe-*` / bucket `fa-live-probe-*-<account>` /
          #   repository `fastagent/live-probe-*` (slash) / runtime `live_probe_*` (underscores).
          # A policy written for the stack pattern alone denies the other three, and does it only after
          # the image is built and pushed. test/live/agentcore-deploy.live.test.ts carries the same map.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: npm run test:live

      # The deploy probe destroys its own app in afterAll, which a job timeout or a cancelled run
      # never reaches — and what it leaves behind is a running Fly app holding the model credential
      # that was staged into it, with nothing else in the world collecting it. `always()` still
      # reaches this step on cancellation, so the sweep lives here rather than in the probe.
      #
      # Scoped to the name the probe mints (`fastagent-live-<uuid8>`, see test/live/fly-deploy) and
      # serialized by the `live` concurrency group, so it cannot destroy another CI run's app. A
      # LOCAL probe run against this same org at this same moment is the one case it would.
      - name: Destroy leftover live Fly apps
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Without this the pipeline's exit code is `xargs`'s, which is 0 on empty input: a failed
          # `apps list` (expired token, Fly 5xx) or a `jq` error would report a clean sweep having
          # deleted nothing. The default shell here is `bash -e {0}` — `-o pipefail` is NOT included.
          set -o pipefail
          flyctl apps list --json \
            | jq -r '.[] | (.Name // .name) | select(test("^fastagent-live-[0-9a-f]{8}$"))' \
            | tee /dev/stderr \
            | xargs -r -n1 -I{} flyctl apps destroy {} --yes

      # Same reasoning as the Fly sweep above, with two Railway specifics: `delete` needs --project
      # outside a TTY even with --yes (the docs call that flag optional), and deletion is SOFT, so a
      # destroyed project keeps being listed — deletedAt, not absence, is what says it is gone.
      # SERVICES now, not projects: both railway probes work inside the standing `fastagent-live-probes`
      # project, which must survive this sweep. A killed deploy probe leaves its service running — with
      # the model credential and an unauthenticated `/invoke` — so this is still the net, one level down.
      - name: Destroy leftover live Railway services
        if: always()
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -o pipefail
          dir="$(mktemp -d)"
          cd "$dir"
          # Nothing to sweep if the project does not exist: no probe reached the point of making one.
          railway link --project fastagent-live-probes --environment production || exit 0
          railway service list --json \
            | jq -r '.[] | select(.name | test("^fastagent-live-[0-9a-f]{8}$")) | .name' \
            | tee /dev/stderr \
            | xargs -r -n1 -I{} railway service delete --service {} --yes

      # Same reasoning as the sweeps above, with AgentCore's twist: THREE kinds are left behind,
      # because the bucket and repository are deliberately created outside the stack (plan.ts: so a
      # `delete-stack` cannot take the agent's memory with it). The bucket is versioned, so every
      # version AND every delete marker goes before the bucket will.
      #
      # Fail-loud like the two sweeps above, and for a sharper reason: this step is the net under a
      # probe that was KILLED, so the run it reports into is already red or cancelled and nobody will
      # read its log. A swallowed `delete-stack` failure (DELETE_FAILED) or a bucket that refuses to go
      # is a Bedrock runtime, a Lambda, an image and a credential-bearing bucket still billing, with
      # nothing else in the world collecting them. Every deletion is still ATTEMPTED even after one
      # fails; "already gone" is the goal state, not a failure.
      #
      # It reads names from a FILE the probe appends to, not from `list-stacks`: the IAM policy scopes
      # this credential to `fastagent-live-probe-*` and account-wide listing is exactly what that
      # refuses. Widening the policy to enumerate every stack in the account, so a cleanup can find
      # the two it owns, is the wrong trade.
      - name: Destroy leftover live AgentCore resources
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -o pipefail
          [ -f "$RUNNER_TEMP/agentcore-probe-names" ] || { echo "no probe ran"; exit 0; }
          account=$(aws sts get-caller-identity --query Account --output text)
          failed=0
          # Tolerates only the goal state; anything else is reported and fails the step.
          attempt() {
            label="$1"; shift
            if ! out=$("$@" 2>&1); then
              case "$out" in
                *"does not exist"*|*NotFound*|*NoSuchBucket*) ;;
                *) echo "::error::$label failed: $out"; failed=1 ;;
              esac
            fi
          }
          # A FILE, not a pipe into `while`: a piped loop runs in a subshell, where every `failed=1`
          # would be discarded at the `done` and this step would go green having reported errors.
          sort -u "$RUNNER_TEMP/agentcore-probe-names" > "$RUNNER_TEMP/agentcore-sweep"
          cat "$RUNNER_TEMP/agentcore-sweep" >&2
          while read -r name; do
            [ -n "$name" ] || continue
            bucket="fa-$name-$account"
            attempt "delete-stack $name" aws cloudformation delete-stack --stack-name "fastagent-$name"
            attempt "wait stack-delete $name" aws cloudformation wait stack-delete-complete --stack-name "fastagent-$name"
            # `s3 rm` does not empty a versioned bucket — it writes a delete marker per object, and a
            # marker comes back under DeleteMarkers, not Versions. Deleting only Versions leaves the
            # bucket non-empty and `delete-bucket` answers BucketNotEmpty.
            attempt "s3 rm $bucket" aws s3 rm "s3://$bucket" --recursive
            if objects=$(aws s3api list-object-versions --bucket "$bucket" --output json 2>&1); then
              payload=$(printf '%s' "$objects" \
                | jq -c '{Objects: [(.Versions // []) + (.DeleteMarkers // [])] | flatten | map({Key, VersionId})}')
              if [ "$(printf '%s' "$payload" | jq '.Objects | length')" -gt 0 ]; then
                attempt "delete-objects $bucket" aws s3api delete-objects --bucket "$bucket" --delete "$payload"
              fi
            else
              case "$objects" in
                *NoSuchBucket*) ;;
                *) echo "::error::list-object-versions $bucket failed: $objects"; failed=1 ;;
              esac
            fi
            attempt "delete-bucket $bucket" aws s3api delete-bucket --bucket "$bucket"
            attempt "delete-repository $name" aws ecr delete-repository --repository-name "fastagent/$name" --force
          done < "$RUNNER_TEMP/agentcore-sweep"
          exit "$failed"
