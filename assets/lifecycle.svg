<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 428" width="860" height="428" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e0d"/>
      <stop offset="100%" stop-color="#070908"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121716"/>
      <stop offset="100%" stop-color="#0d1110"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#465954"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <style>
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .kicker { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; fill: #2dd4bf; }
    .heading { font-size: 15px; font-weight: 700; fill: #f1f4f7; }
    .sub { font-size: 12px; fill: #8b9692; }
    .item { font-size: 12px; fill: #d5dcd9; }
    .dim { font-size: 11px; fill: #7c8884; }
    .box-label { font-size: 10.5px; fill: #7c8884; }
    .badge-txt { font-size: 10.5px; font-weight: 600; }
  </style>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="858" height="426" rx="12" fill="url(#bg)" stroke="#1e2624" stroke-width="1"/>

  <!-- Top Header -->
  <text x="24" y="32" class="kicker">AGENT SOFTWARE ENGINEERING LIFECYCLE</text>
  <text x="836" y="32" text-anchor="end" class="dim mono">Git → npm package → any scale</text>
  <line x1="24" y1="46" x2="836" y2="46" stroke="#1a2220" stroke-width="1"/>

  <!-- Column 3 Kicker for consistent visual rhythm -->
  <text x="564" y="72" class="kicker">03 · RUN &amp; SCALE (ONE AGENT API)</text>

  <!-- STEP 1: WRITE & MAINTAIN -->
  <rect x="24" y="84" width="224" height="296" rx="10" fill="url(#card)" stroke="#222c29" stroke-width="1"/>
  <text x="40" y="110" class="kicker">01 · WRITE &amp; MAINTAIN</text>
  <text x="40" y="130" class="heading">Humans + Coding Agents</text>
  <text x="40" y="148" class="sub">Zero DSL. Markdown &amp; TypeScript.</text>
  <line x1="40" y1="162" x2="232" y2="162" stroke="#1e2724" stroke-width="1"/>

  <g class="mono item">
    <text x="40" y="188"><tspan fill="#2dd4bf">▸</tspan> SYSTEM.md · AGENTS.md</text>
    <text x="40" y="214"><tspan fill="#6aa5f8">▸</tspan> skills/ · prompts/</text>
    <text x="40" y="240"><tspan fill="#e0bd68">▸</tspan> src/tools/ (defineTool)</text>
    <text x="40" y="266"><tspan fill="#b795f5">▸</tspan> fastagent.config.ts</text>
  </g>

  <rect x="40" y="292" width="192" height="72" rx="7" fill="#090c0b" stroke="#1d2623"/>
  <text x="52" y="312" class="box-label mono">AI-native &amp; CI CLI</text>
  <text x="52" y="332" class="mono" font-size="11" fill="#d5dcd9">fastagent info --json</text>
  <text x="52" y="350" class="mono" font-size="11" fill="#8b9692">Exit codes 0 / 1 / 2 · tsc</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="248" y1="232" x2="288" y2="232" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <text x="268" y="220" text-anchor="middle" class="mono" font-size="10" fill="#2dd4bf">build</text>

  <!-- STEP 2: BUILD & CI GATE -->
  <rect x="292" y="84" width="224" height="296" rx="10" fill="url(#card)" stroke="#222c29" stroke-width="1"/>
  <text x="308" y="110" class="kicker">02 · PACKAGE &amp; CI GATE</text>
  <text x="308" y="130" class="heading">Immutable npm Artifact</text>
  <text x="308" y="148" class="sub">Version, publish &amp; roll back.</text>
  <line x1="308" y1="162" x2="500" y2="162" stroke="#1e2724" stroke-width="1"/>

  <g class="mono item">
    <text x="308" y="188"><tspan fill="#7ecf8a">✓</tspan> dist/index.js + .d.ts</text>
    <text x="308" y="214"><tspan fill="#7ecf8a">✓</tspan> package.json (peerDeps)</text>
    <text x="308" y="240"><tspan fill="#7ecf8a">✓</tspan> build.json (SHA-256)</text>
    <text x="308" y="266"><tspan fill="#7ecf8a">✓</tspan> deploy check (no leaks)</text>
  </g>

  <rect x="308" y="292" width="192" height="72" rx="7" fill="#090c0b" stroke="#1d2623"/>
  <text x="320" y="312" class="box-label mono">SemVer distribution</text>
  <text x="320" y="332" class="mono" font-size="11" fill="#e0bd68">@acme/copilot@1.4.2</text>
  <text x="320" y="350" class="mono" font-size="11" fill="#8b9692">npm publish or workspace</text>

  <!-- Branch Arrows 2 -> 3 -->
  <path d="M 516 232 L 538 232 L 538 129 L 560 129" fill="none" stroke="#465954" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="516" y1="232" x2="560" y2="232" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <path d="M 516 232 L 538 232 L 538 335 L 560 335" fill="none" stroke="#465954" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- STEP 3: RUN & SCALE (3 stacked cards) -->
  <!-- Card 3A: Embedded Multi-Tenant -->
  <rect x="564" y="84" width="272" height="90" rx="10" fill="url(#card)" stroke="#1e3d38" stroke-width="1"/>
  <text x="580" y="106" class="heading" font-size="14">Embed in Your Node.js App</text>
  <text x="580" y="124" class="sub">Next.js · Hono · Express · Fastify</text>
  <rect x="580" y="136" width="240" height="24" rx="5" fill="#102925"/>
  <text x="700" y="152" text-anchor="middle" class="mono badge-txt" fill="#2dd4bf">1 PG pool (20) → 1,000 tenants</text>

  <!-- Card 3B: Self-Host & Sleep When Idle -->
  <rect x="564" y="187" width="272" height="90" rx="10" fill="url(#card)" stroke="#1f3147" stroke-width="1"/>
  <text x="580" y="209" class="heading" font-size="14">Self-Host · Sleep When Idle</text>
  <text x="580" y="227" class="sub">Docker · Compose · Fly.io · Railway</text>
  <rect x="580" y="239" width="240" height="24" rx="5" fill="#101f33"/>
  <text x="700" y="255" text-anchor="middle" class="mono badge-txt" fill="#6aa5f8">~98% less idle compute vs 24/7*</text>

  <!-- Card 3C: Per-User AWS MicroVMs -->
  <rect x="564" y="290" width="272" height="90" rx="10" fill="url(#card)" stroke="#312447" stroke-width="1"/>
  <text x="580" y="312" class="heading" font-size="14">Per-User AWS MicroVMs</text>
  <text x="580" y="330" class="sub">Sandboxed Cloud Containers + Postgres</text>
  <rect x="580" y="342" width="240" height="24" rx="5" fill="#1e1530"/>
  <text x="700" y="358" text-anchor="middle" class="mono badge-txt" fill="#b795f5">0 always-on servers · isolated VMs</text>

  <!-- Footer footnote -->
  <text x="24" y="408" class="dim">*Illustrative event-driven workload: 20 runs/day × 1 min (~10 active hrs/mo vs 720 always-on hrs/mo). Every target exposes Agent API (/v1).</text>
</svg>
